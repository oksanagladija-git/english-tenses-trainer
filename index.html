ying for an hour before dinner.","She had not been studying for an hour before dinner.","Had she been studying for an hour before dinner?"],"lv":"Viņa bija mācījusies stundu pirms vakariņām.","mistake":"Jābūt abiem vārdiem had been, pēc tam V-ing.","cue":"for an hour before dinner"},{"name":"Future Simple","when":"Prognozes, spontāni lēmumi un solījumi par nākotni.","clues":"tomorrow, next week, I think","affirm":"Persona + will + V1","negative":"Persona + will not + V1","question":"Will + persona + V1?","sample":["She will play football tomorrow.","She will not play football tomorrow.","Will she play football tomorrow?"],"lv":"Viņa rīt spēlēs futbolu.","mistake":"Pēc will ir pamatforma: will go, nevis will goes.","cue":"tomorrow"},{"name":"Future Continuous","when":"Darbība notiks kādā noteiktā nākotnes brīdī.","clues":"at six tomorrow, this time tomorrow","affirm":"Persona + will be + V-ing","negative":"Persona + will not be + V-ing","question":"Will + persona + be + V-ing?","sample":["She will be playing football at six tomorrow.","She will not be playing football at six tomorrow.","Will she be playing football at six tomorrow?"],"lv":"Viņa rīt sešos spēlēs futbolu.","mistake":"Nepalaid garām be: will be playing.","cue":"at six tomorrow"},{"name":"Future Perfect","when":"Darbība būs pabeigta līdz noteiktam nākotnes brīdim.","clues":"by Friday, by six, by then","affirm":"Persona + will have + V3","negative":"Persona + will not have + V3","question":"Will + persona + have + V3?","sample":["She will have finished her homework by Friday.","She will not have finished her homework by Friday.","Will she have finished her homework by Friday?"],"lv":"Viņa būs pabeigusi mājasdarbu līdz piektdienai.","mistake":"Nepalaid garām have un V3: will have finished.","cue":"by Friday"},{"name":"Future Perfect Continuous","when":"Darbība līdz konkrētam nākotnes brīdim būs ilgusi noteiktu laiku.","clues":"for two hours by six, by next year","affirm":"Persona + will have been + V-ing","negative":"Persona + will not have been + V-ing","question":"Will + persona + have been + V-ing?","sample":["She will have been studying for two hours by six tomorrow.","She will not have been studying for two hours by six tomorrow.","Will she have been studying for two hours by six tomorrow?"],"lv":"Līdz rītdienas sešiem viņa būs mācījusies jau divas stundas.","mistake":"Visa secība: will have been + V-ing.","cue":"for two hours by six tomorrow"},{"name":"Be going to","when":"Iepriekš iecerēti nākotnes plāni vai prognozes, kas balstītas uz pašreiz redzamo.","clues":"tomorrow, next weekend, look at the clouds","affirm":"Persona + am/is/are going to + V1","negative":"Persona + am/is/are not going to + V1","question":"Am/Is/Are + persona + going to + V1?","sample":["She is going to play football tomorrow.","She is not going to play football tomorrow.","Is she going to play football tomorrow?"],"lv":"Viņa rīt plāno spēlēt futbolu.","mistake":"Jāpielāgo am/is/are atbilstoši personai; pēc to seko V1.","cue":"tomorrow"}], V=[{"base":"play","past":"played","part":"played","ing":"playing","obj":"football","irregular":false,"durative":true},{"base":"watch","past":"watched","part":"watched","ing":"watching","obj":"TV","irregular":false,"durative":true},{"base":"study","past":"studied","part":"studied","ing":"studying","obj":"English","irregular":false,"durative":true},{"base":"work","past":"worked","part":"worked","ing":"working","obj":"in the garden","irregular":false,"durative":true},{"base":"walk","past":"walked","part":"walked","ing":"walking","obj":"to school","irregular":false,"durative":true},{"base":"help","past":"helped","part":"helped","ing":"helping","obj":"my friend","irregular":false,"durative":true},{"base":"clean","past":"cleaned","part":"cleaned","ing":"cleaning","obj":"the room","irregular":false,"durative":true},{"base":"cook","past":"cooked","part":"cooked","ing":"cooking","obj":"dinner","irregular":false,"durative":true},{"base":"visit","past":"visited"," ying","obj":"a book","irregular":true,"durative":false},{"base":"drink","past":"drank","part":"drunk","ing":"drinking","obj":"water","irregular":true,"durative":false},{"base":"read","past":"read","part":"read","ing":"reading","obj":"a book","irregular":true,"durative":true},{"base":"make","past":"made","part":"made","ing":"making","obj":"a cake","irregular":true,"durative":false},{"base":"do","past":"did","part":"done","ing":"doing","obj":"homework","irregular":true,"durative":false},{"base":"run","past":"ran","part":"run","ing":"running","obj":"in the park","irregular":true,"durative":true},{"base":"swim","past":"swam","part":"swum","ing":"swimming","obj":"in the pool","irregular":true,"durative":true},{"base":"sleep","past":"slept","part":"slept","ing":"sleeping","obj":"well","irregular":true,"durative":true},{"base":"speak","past":"spoke","part":"spoken","ing":"speaking","obj":"English","irregular":true,"durative":true},{"base":"sing","past":"sang","part":"sung","ing":"singing","obj":"a song","irregular":true,"durative":true},{"base":"teach","past":"taught","part":"taught","ing":"teaching","obj":"English","irregular":true,"durative":true},{"base":"begin","past":"began","part":"begun","ing":"beginning","obj":"a lesson","irregular":true,"durative":false},{"base":"ride","past":"rode","part":"ridden","ing":"riding","obj":"a bike","irregular":true,"durative":true}], SUBJECTS=['I','you','he','she','we','they'];

function expandedOptions(input){
 let v=String(input).replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim().toLowerCase();
 v=v.replace(/\bwon't\b/g,'will not').replace(/\bshan't\b/g,'shall not').replace(/\bcan't\b/g,'cannot');
 v=v.replace(/\b([a-z]+)n't\b/g,(_,p)=>p==='ca'?'cannot':p+' not');
 v=v.replace(/\bi'm\b/g,'i am').replace(/\b([a-z]+)'re\b/g,'$1 are')
  .replace(/\b([a-z]+)'ve\b/g,'$1 have').replace(/\b([a-z]+)'ll\b/g,'$1 will')
  .replace(/\b([a-z]+)'d\b/g,'$1 had');
 v=v.replace(/\b([a-z]+)'s\b/g,'$1 {is|has}');
 v=v.replace(/[.?!]+$/,'').trim().replace(/\s+/g,' ');
 let out=[v];for(let i=0;i<4;i++){if(!out.some(s=>s.includes('{is|has}')))break;out=out.flatMap(s=>s.includes('{is|has}')?[s.replace('{is|has}','is'),s.replace('{is|has}','has')]:[s])}
 return [...new Set(out)];
}
function normalizedTokens(x){return x?x.split(' '):[]}

  add(x.answer,'full',true);
 }else add(x.answer,'full',true);return a;
}
function grade(x,input){

}
// Levenshtein pa vārdiem; katru kļūdaino ievadīto vārdu izceļam sarkanā krāsā.
function compareTokens(given,expected){
 const raw=given.match(/\S+/g)||[];
 const expectedVariations=expandedOptions(expected).map(normalizedTokens);
 let best=null;
 for(const expansion of expandedOptions(given)){
  const tokens=normalizedTokens(expansion);for(const target of expectedVariations){
   const dp=Array.from({length:tokens.length+1},()=>Array(target.length+1).fill(0));
   for(let i=0;i<=tokens.length;i++)dp[i][0]=i;
   for(let j=0;j<=target.length;j++)dp[0][j]=j;
   for(let i=1;i<=tokens.length;i++)for(let j=1;j<=target.length;j++){
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(tokens[i-1]===target[j-1]?0:1));
   }
   if(!best||dp[tokens.length][target.length]<best.dist){
    let i=tokens.length,j=target.length,bad=[],fix=[],removed=[];
    while(i||j){
     if(i&&j&&tokens[i-1]===target[j-1]&&dp[i][j]===dp[i-1][j-1]){i--;j--}
     else if(i&&j&&dp[i][j]===dp[i-1][j-1]+1){bad.push(i-1);fix.push(target[j-1]);removed.push(tokens[i-1]);i--;j--}
     else if(j&&dp[i][j]===dp[i][j-1]+1){fix.push(target[j-1]);j--}
     else{bad.push(i-1);removed.push(tokens[i-1]);i--}
    }
    best={dist:dp[tokens.length][target.length],expanded:tokens,bad,badValues:removed,fix,raw};
   }
  }
 }
 if(!best)return {html:esc(given),missing:[],wrong:[]};
 // Izplestie vārdi (piem., aren't -> are not) norāda uz vienu ievadīto tokenu.
 // Meklējam atbilstošo īsto tokenu pēc tā ekvivalentajām daļām.
 let projected=[],index=0;
 for(let k=0;k<raw.length;k++){
  const normalizedRaw=raw[k].replace(/[.?!]+$/,'');
  const variants=expandedOptions(normalizedRaw).map(normalizedTokens);
  const chosen=variants.find(z=>best.expanded.slice(index,index+z.length).join(' ')===z.join(' '))||variants[0]||[];
  for(let q=0;q<chosen.length;q++)projected.push(k);index+=chosen.length;
 }

 const html=raw.map((r,i)=>wrong.has(i)?`<span class="error-token">${esc(r)}</span>`:esc(r)).join(' ');
 return {html,missing:[...new Set(best.fix)],wrong:best.badValues};
}

  if(!result.capOK)return 'Teikums jāsāk ar lielo burtu.';
  if(!result.pronounOK)return 'Vietniekvārdu “I” vienmēr raksta ar lielo burtu.';
  if(!result.punctOK)return x.type==='q'?'Pilnu jautājumu beidz ar jautājuma zīmi (?).':'Pilnu teikumu beidz ar punktu (.).';
 }
 const wrong=comparison.wrong,need=comparison.missing;
 if(wrong.length===1&&need.length===1&&wrong[0]!==need[0])return `Vārda “${wrong[0]}” vietā nepieciešams “${need[0]}”. Pārbaudi vārda formu un saglabā dotā teikuma nozīmi.`;
 if(wrong.length===0&&need.length)return `Atbildē trūkst: ${need.slice(0,5).join(', ')}.`;
 if(wrong.length&&need.length)return `Pārbaudi iekrāsoto atbildes daļu. Piemēram, nepieciešams: ${need.slice(0,6).join(' ')}.`;
 if(wrong.length)return `Atbildē ir lieks vai nepareizs vārds: ${wrong.slice(0,5).join(', ')}.`;
 if(x.t===2&&x.type!=='pos')return 'Past Simple jautājumos un noliegumos pēc did lieto V1 (pamatformu).';
 return 'Pārbaudi darbības vārda formu un teikuma saturu.';
}
function highlightAnswer(x,v,result,example){
 let targets=accepted(x).map(c=>c.s),best=null;
 for(const t of targets){let c=compareTokens(v,t);const rank=c.wrong.length+c.missing.length;
  if(best===null||rank<best.rank){best={...c,rank,target:t}}}
 const c=best||{html:esc(v),missing:[],wrong:[]};
 if(result.grammar&&!result.capOK){let words=v.match(/\S+/g)||[];c.html=words.map((w,i)=>i===0?`<span class="error-token">${esc(w)}</span>`:esc(w)).join(' ')}
 else if(result.grammar&&!result.pronounOK){c.html=esc(v).replace(/\bi\b/g,'<span class="error-token">i</span>')}
 else if(result.grammar&&!result.punctOK)c.html=esc(v)+`<span class="error-token"> ${x.type==='q'?'?':'.'} trūkst</span>`;
 return `<div class="small">Tava atbilde — kļūdainā daļa sarkanā:</div><div class="review-answer">${c.html}</div><div class="small">Pareizās atbildes piemērs:</div><div class="review-answer"><b>${esc(example)}</b></div><div class="diff-note">💡 ${esc(feedbackExplanation(x,result,c,v))}</div>`;
}
function check(){
 if(!session||session.checked)return;const x=session.tasks[session.i],v=$('answer').value;
 if(!v.trim()){$('answer').focus();return}
 const result=grade(x,v);session.checked=true;session.score+=Number(result.okay);
 session.results.push({x,correct:result.okay,submitted:v});const st=db.stats[x.keySkill]||{r:0,w:0};
 st[result.okay?'r':'w']=(st[result.okay?'r':'w']||0)+1;db.stats[x.keySkill]=st;
 let rev=db.review[x.keySkill]||{streak:0};rev.streak=result.okay?Math.min((rev.streak||0)+1,5):0;
 rev.next=Date.now()+([0,1,3,7,14,30][rev.streak])*86400000;db.review[x.keySkill]=rev;save();$('answer').disabled=true;
 const example=x.mode==='gap'?(x.type==='q'?cap(x.forms.q):x.forms[x.type]):x.answer;
 $('feedback').innerHTML=`<div class="feedback ${result.okay?'correct':'incorrect'}"><strong class="${result.okay?'good':'bad'}">${result.okay?'✓ Pareizi!':'✗ Nepareizi'}</strong>${result.okay?'<div>Tava atbilde ir pieņemta.</div>':highlightAnswer(x,v,result,example)}</div>`;
 $('checkBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');
 if(session.i===session.tasks.length-1)$('nextBtn').textContent='Skatīt rezultātu →';
}

function finish(){const s=session,p=Math.round(100*s.score/s.tasks.length);
if(practiceOrigin==='exam'&&!s.historyRecorded){db.examHistory.push({date:Date.now(),tenses:s.examTenses,score:s.score,total:s.tasks.length,includeIrregular:s.examIrregular});db.examHistory=db.examHistory.slice(-100);s.historyRecorded=true;save()}
let byTense={};for(const item of s.results){const i=item.x.t;byTense[i]||={correct:0,total:0};byTense[i].total++;byTense[i].correct+=Number(item.correct)}
const breakdown=practiceOrigin==='exam'?`<div class="card"><h2>📊 Rezultāti pa laikiem</h2>${Object.entries(byTense).sort((a,b)=>Number(a[0])-Number(b[0])).map(([i,v])=>`<div class="stat-row"><b>${esc(T[+i].name)}</b> · ${v.correct} no ${v.total} pareizi<div class="progress-track"><div class="progress-fill" style="width:${Math.round(v.correct/v.total*100)}%"></div></div></div>`).join('')}</div>`:'';
app.innerHTML=`<div class="card"><h2>${practiceOrigin==='exam'?'🏆 Eksāmens pabeigts!':'🎉 Tests pabeigts!'}</h2><div class="statbig" style="text-align:center;font-size:47px">${p}%</div><p style="text-align:center">${s.score} no ${s.tasks.length} pareizi</p><div class="actions"><button onclick="nav('${practiceOrigin}')">Jauns treniņš</button><button class="primary" onclick="nav('progress')">Skatīt progresu</button></div></div>${breakdown}<div class="card"><h2>Atbilžu pārskats</h2><p class="small">Nepareizās atbildes ir izceltas sarkanā krāsā.</p>${s.results.map((r,i)=>`<div class="result-review-row ${r.correct?'right':'wrong'}"><div class="result-review-label">${r.correct?'✓':'✗'} ${i+1}. ${esc(T[r.x.t].name)} · ${r.x.type==='pos'?'Apgalvojums':r.x.type==='neg'?'Noliegums':'Jautājums'}</div>${r.correct?`<span class="result-review-correct">Pareizi: ${esc(r.x.answer)}</span>`:`<span class="result-review-submitted">Tava atbilde: ${esc(r.submitted)}</span><span class="result-review-correct">Pareizi: ${esc(r.x.answer)}</span>`}</div>`).join('')}</div>`}
function progress(){let rows=T.map((t,i)=>({...countStats(i),name:t.name,i})),r=rows.reduce((s,x)=>s+x.right,0),w=rows.reduce((s,x)=>s+x.wrong,0);app.innerHTML=`<div class="card"><h2>📊 Mans progress</h2><div class="stats"><div><div class="statbig">${r+w}</div><span class="small">Atbildes</span></div><div><div class="statbig">${r+w?Math.round(r/(r+w)*100)+'%':'—'}</div><span class="small">Pareizi</span></div></div><p class="small">Precizitāte ir pareizo atbilžu īpatsvars, nevis oficiāls valodas zināšanu vērtējums.</p></div><div class="card"><h2>Progress pa laikiem</h2>${rows.map(z=>`<div class="stat-row"><b>${esc(z.name)}</b> ${db.selectedTenses.includes(z.i)?'<span class="pill">Mācos</span>':''}<div class="small">${z.total?z.total+' atbildes · '+z.pct+'% pareizi':'Vēl nav trenēts'}</div><div class="progress-track"><div class="progress-fill" style="width:${z.pct||0}%"></div></div></div>`).join('')}</div><div class="card"><h2>Iestatījumi</h2><p class="small">Vārdi: ${db.includeIrregular?'regulārie un neregulārie':'tikai regulārie'}.</p><p class="small">Progress saglabājas konkrētajā ierīcē un pārlūkprogrammā. Pirms atjauninājuma nevajag dzēst vietnes datus.</p><button class="danger" onclick="if(confirm('Vai tiešām dzēst tikai treniņu rezultātus?')){db.stats={};db.review={};save();progress()}">Dzēst rezultātus</button></div>`}
